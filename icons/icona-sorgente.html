<!doctype html>
<!-- Sorgente dell'icona: un piatto di ceramica visto dall'alto con riso, pollo grigliato, pomodorini e insalata,
     su fondo blu abisso (stesso stile del Diario di Ghisa). Il riso e' disegnato chicco per chicco dallo script.
     Per rifare i PNG: screenshot con Playwright a misura (vedi skill aggiorna-app). ?m=1 = maskable (piatto nell'80% centrale). -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;padding:0;background:#051E29;overflow:hidden}
svg{display:block;width:100vw;height:100vh}
</style></head><body>
<svg viewBox="0 0 100 100" id="ic">
  <defs>
    <radialGradient id="fondo" cx="30%" cy="18%" r="100%">
      <stop offset="0" stop-color="#11546A"/><stop offset=".5" stop-color="#072A39"/><stop offset="1" stop-color="#03131B"/>
    </radialGradient>
    <!-- ceramica: tesa e fondo del piatto -->
    <radialGradient id="tesa" cx="40%" cy="35%" r="68%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".72" stop-color="#F1F4F5"/><stop offset=".93" stop-color="#D3DCE0"/><stop offset="1" stop-color="#AFBCC2"/>
    </radialGradient>
    <radialGradient id="cavo" cx="45%" cy="40%" r="62%">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".8" stop-color="#F3F6F7"/><stop offset="1" stop-color="#DCE3E6"/>
    </radialGradient>
    <linearGradient id="gradino" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9D3D8"/><stop offset=".5" stop-color="#E9EEF0"/><stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="ombra" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="ombretta" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation=".9"/></filter>
    <!-- pollo grigliato -->
    <linearGradient id="carne" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2C98A"/><stop offset=".55" stop-color="#D99A4E"/><stop offset="1" stop-color="#B8742F"/>
    </linearGradient>
    <linearGradient id="taglio" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBF1E1"/><stop offset="1" stop-color="#EFD9B8"/>
    </linearGradient>
    <!-- pomodorino -->
    <radialGradient id="pomodoro" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FF8A70"/><stop offset=".55" stop-color="#E5341F"/><stop offset="1" stop-color="#A51B10"/>
    </radialGradient>
    <radialGradient id="polpa" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#FFB49A"/><stop offset="1" stop-color="#F0503A"/>
    </radialGradient>
    <linearGradient id="foglia" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BD45B"/><stop offset="1" stop-color="#3E8E2F"/>
    </linearGradient>
    <linearGradient id="foglia2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC04A"/><stop offset="1" stop-color="#2F7426"/>
    </linearGradient>
  </defs>

  <rect width="100" height="100" fill="url(#fondo)"/>

  <g id="g">
    <!-- ombra del piatto sul tavolo -->
    <ellipse cx="52" cy="54.5" rx="38" ry="37" fill="#000" opacity=".55" filter="url(#ombra)"/>
    <!-- tesa -->
    <circle cx="50" cy="50" r="39" fill="url(#tesa)"/>
    <circle cx="50" cy="50" r="38.6" fill="none" stroke="#19D3F3" stroke-width=".9" opacity=".85"/>
    <!-- gradino tra tesa e fondo -->
    <circle cx="50" cy="50" r="28.6" fill="none" stroke="url(#gradino)" stroke-width="1.6"/>
    <circle cx="50" cy="50" r="27.6" fill="url(#cavo)"/>
    <!-- riflesso sulla tesa -->
    <path d="M22 33 A33 33 0 0 1 41 16.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" opacity=".9"/>

    <g id="cibo" transform="translate(50 52) scale(1.14) translate(-50 -52)">
    <!-- insalata (sotto) -->
    <g filter="url(#ombretta)" opacity=".35"><ellipse cx="60" cy="66" rx="12" ry="6" fill="#2a3b2a"/></g>
    <path d="M47 64 C52 55 63 55 70 60 C66 63 62 70 54 70 C51 70 48 68 47 64Z" fill="url(#foglia)"/>
    <path d="M55 72 C57 63 66 60 73 63 C72 69 66 74 58 74Z" fill="url(#foglia2)"/>
    <path d="M64 58 C68 51 76 51 79 55 C77 60 72 63 66 62Z" fill="#5FAE3C"/>
    <path d="M65 61 C69 57 73 55 78 55" fill="none" stroke="#D8F5B0" stroke-width=".5" opacity=".8" stroke-linecap="round"/>
    <path d="M49 64 C55 61 62 60 68 61 M57 72 C61 67 66 65 71 64" fill="none" stroke="#D8F5B0" stroke-width=".6" opacity=".8" stroke-linecap="round"/>

    <!-- pomodorini -->
    <g id="pomodori"></g>

    <!-- riso -->
    <g filter="url(#ombretta)" opacity=".28"><ellipse cx="38.5" cy="57" rx="12.5" ry="10" fill="#4a5560"/></g>
    <ellipse cx="38.5" cy="55.5" rx="12" ry="9.6" fill="#EDE6D6"/>
    <ellipse cx="37" cy="53.5" rx="8" ry="6" fill="#F8F4EA"/>
    <g id="riso"></g>

    <!-- pollo a fette -->
    <g filter="url(#ombretta)" opacity=".35"><ellipse cx="57" cy="39" rx="14" ry="9" fill="#5a3a20" transform="rotate(-25 57 39)"/></g>
    <g id="pollo"></g>
    </g>
  </g>
</svg>
<script>
// numeri "casuali" sempre uguali, cosi' l'icona esce identica ogni volta
let seme = 7;
const rnd = () => (seme = (seme * 16807) % 2147483647) / 2147483647;
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attr, padre) => { const e = document.createElementNS(NS, tag); for (const k in attr) e.setAttribute(k, attr[k]); padre.appendChild(e); return e; };

// riso: un mucchietto di chicchi, piu' fitti al centro, con luce in alto a sinistra
const riso = document.getElementById("riso");
for (let i = 0; i < 300; i++){
  const a = rnd() * Math.PI * 2, r = Math.sqrt(rnd()) * 10.5;
  const x = 38.5 + Math.cos(a) * r * 1.15, y = 55.5 + Math.sin(a) * r * .92;
  const luce = Math.max(0, Math.min(1, .75 - (x - 33) * .02 - (y - 50) * .025 + rnd() * .15));
  const c = Math.round(222 + luce * 33), g = Math.round(214 + luce * 38), bl = Math.round(196 + luce * 50);
  el("ellipse", {cx: x.toFixed(2), cy: y.toFixed(2), rx: 1.25, ry: .55, transform: `rotate(${Math.round(rnd() * 180)} ${x.toFixed(2)} ${y.toFixed(2)})`,
    fill: `rgb(${c},${g},${Math.min(255, bl)})`, stroke: "rgba(170,160,140,.28)", "stroke-width": ".1"}, riso);
}

// pollo: tre fette con il segno della griglia e l'interno chiaro sul taglio
const pollo = document.getElementById("pollo");
[[0, 50.5, 35, -28], [1, 56, 38.5, -24], [2, 61.5, 42.5, -20]].forEach(([i, x, y, rot]) => {
  const g = el("g", {transform: `translate(${x} ${y}) rotate(${rot})`}, pollo);
  el("rect", {x: -9, y: -4.2, width: 18, height: 8.4, rx: 4.2, fill: "url(#carne)"}, g);
  el("rect", {x: 6.2, y: -3.6, width: 2.6, height: 7.2, rx: 1.3, fill: "url(#taglio)"}, g);
  for (let k = -6; k <= 4; k += 3.2) el("path", {d: `M${k} -3.6 L${k + 2.4} 3.6`, stroke: "#6B3A12", "stroke-width": ".9", "stroke-linecap": "round", opacity: ".75"}, g);
  el("path", {d: "M-7 -3 Q0 -4.6 6 -3", fill: "none", stroke: "#FFE6BC", "stroke-width": ".7", opacity: ".8", "stroke-linecap": "round"}, g);
});

// pomodorini tagliati a meta' e uno intero
const pom = document.getElementById("pomodori");
el("circle", {cx: 69, cy: 57, r: 4.1, fill: "url(#pomodoro)"}, pom);
el("path", {d: "M68 53.4 l1 1.4 l1.2 -1.2 M69 54.8 l-1.4 .6", stroke: "#3E8E2F", "stroke-width": ".8", fill: "none", "stroke-linecap": "round"}, pom);
el("circle", {cx: 67.6, cy: 55.6, r: 1, fill: "#fff", opacity: ".7"}, pom);
[[61.5, 70.5], [67.5, 66.5]].forEach(([x, y]) => {
  el("circle", {cx: x, cy: y, r: 3.7, fill: "#C42A18"}, pom);
  el("circle", {cx: x, cy: y, r: 3.1, fill: "url(#polpa)"}, pom);
  for (let k = 0; k < 3; k++){ const a = k * 2.1 + .4; el("ellipse", {cx: (x + Math.cos(a) * 1.5).toFixed(2), cy: (y + Math.sin(a) * 1.5).toFixed(2), rx: .75, ry: .45, fill: "#FCE7A8", transform: `rotate(${a * 57} ${x + Math.cos(a) * 1.5} ${y + Math.sin(a) * 1.5})`}, pom); }
  el("circle", {cx: x, cy: y, r: .6, fill: "#FFD2C2"}, pom);
});

if (new URLSearchParams(location.search).get("m") === "1")
  document.getElementById("g").setAttribute("transform", "translate(50 50) scale(.8) translate(-50 -50)");
</script>
</body></html>
