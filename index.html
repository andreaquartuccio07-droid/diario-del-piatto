<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diario del Piatto</title>
<meta name="description" content="Calorie e macro di ogni pasto, peso e progressi verso l'obiettivo.">
<meta name="theme-color" content="#A9E9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B3A48" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Piatto">
<link rel="apple-touch-icon" sizes="180x180" href="icons/piatto-home-180.png">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<style>
/* Font in locale (gli stessi del Diario di Ghisa): ci sono anche senza campo. */
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Sans";font-style:normal;font-weight:400 600;font-display:swap;src:url(fonts/ibm-plex-sans.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:500;font-display:swap;src:url(fonts/ibm-plex-mono-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/ibm-plex-mono-600.woff2) format("woff2")}

/* Stile "Abisso", lo stesso del Diario di Ghisa: fondo chiaro con luce ciano in alto, vetro chiaro
   per i riquadri normali, vetro scuro solo per cio' che conta (le kcal che mancano, la barra in basso). */
:root{
  --f-tit:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --bg:#F1F5F6; --surface:#FFFFFF; --surface-2:#E3EAED; --surface-3:#F6F9FA;
  --glass:rgba(255,255,255,.8); --edge:rgba(6,32,43,.3);
  --ink:#06202B; --ink-2:#3E5560; --ink-3:#5E747E;
  --line:#AEBDC5; --line-2:#90A3AD;
  --accent:#19D3F3; --accent-soft:rgba(25,211,243,.16); --accent-ink:#00697F; --on-accent:#03202A;
  --up:#0B7A54; --up-soft:rgba(11,122,84,.11); --on-up:#FFFFFF; --down:#B0402C;
  --vol:#D5E0E5; --dato:#008CA6;
  --deep:rgba(5,30,41,.9); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
  --aurora-top:#A9E9F6; --aurora-2:rgba(40,150,220,.3);
  --shadow:0 6px 22px rgba(6,32,43,.1); --shadow-alta:0 20px 60px rgba(6,32,43,.3); --scrim:rgba(4,20,27,.5);
  --r:20px;
  --m-carbo:#008CA6; --m-prote:#0B7A54; --m-grassi:#C08A06;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#040B0E; --surface:#101C22; --surface-2:#1B2A32; --surface-3:#16242B;
    --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.22);
    --ink:#E8F6FA; --ink-2:#A3BEC8; --ink-3:#7C98A3;
    --line:#34474F; --line-2:#475D68;
    --accent:#2BD9F5; --accent-soft:rgba(43,217,245,.15); --accent-ink:#5FE3F8; --on-accent:#03181E;
    --up:#4FD69A; --up-soft:rgba(79,214,154,.14); --on-up:#03181E; --down:#E2705C;
    --vol:#22323A; --dato:#2BD9F5;
    --deep:rgba(20,60,74,.74); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
    --aurora-top:#0B3A48; --aurora-2:rgba(30,100,170,.24);
    --shadow:0 6px 22px rgba(0,0,0,.45); --shadow-alta:0 20px 60px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
    --m-carbo:#2BD9F5; --m-prote:#4FD69A; --m-grassi:#F0B838;
  }
}
:root[data-theme="dark"]{
  --bg:#040B0E; --surface:#101C22; --surface-2:#1B2A32; --surface-3:#16242B;
  --glass:rgba(255,255,255,.06); --edge:rgba(255,255,255,.22);
  --ink:#E8F6FA; --ink-2:#A3BEC8; --ink-3:#7C98A3;
  --line:#34474F; --line-2:#475D68;
  --accent:#2BD9F5; --accent-soft:rgba(43,217,245,.15); --accent-ink:#5FE3F8; --on-accent:#03181E;
  --up:#4FD69A; --up-soft:rgba(79,214,154,.14); --on-up:#03181E; --down:#E2705C;
  --vol:#22323A; --dato:#2BD9F5;
  --deep:rgba(20,60,74,.74); --deep-ink:#EAF8FC; --deep-ink-2:#A9C6D0; --deep-fill:rgba(255,255,255,.11); --glow:#5BE6FF;
  --aurora-top:#0B3A48; --aurora-2:rgba(30,100,170,.24);
  --shadow:0 6px 22px rgba(0,0,0,.45); --shadow-alta:0 20px 60px rgba(0,0,0,.6); --scrim:rgba(0,0,0,.6);
  --m-carbo:#2BD9F5; --m-prote:#4FD69A; --m-grassi:#F0B838;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(280px 150px at 6% 170px,var(--aurora-2),transparent 100%),
  linear-gradient(180deg,var(--aurora-top),transparent 360px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button,.tab,.eyebrow{-webkit-user-select:none;user-select:none}
:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px;border-radius:4px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:760px;margin:0 auto;padding:0 max(13px,env(safe-area-inset-right)) 0 max(13px,env(safe-area-inset-left))}
header.top{position:sticky;top:0;z-index:40;padding-top:env(safe-area-inset-top);background:linear-gradient(180deg,var(--aurora-top) 30%,color-mix(in srgb,var(--aurora-top) 72%,transparent));-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.top-in{display:flex;align-items:center;gap:9px;height:54px}
.brand{font-family:var(--f-tit);font-weight:700;font-size:19px;letter-spacing:.03em;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand .bar{width:22px;height:8px;border-radius:4px;background:var(--accent-ink)}
.menu{position:relative}
.menu>summary{list-style:none;width:44px;height:44px;display:grid;place-items:center;border-radius:14px;border:1px solid var(--edge);background:var(--glass)}
.menu>summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:50px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-alta);padding:6px;min-width:250px;z-index:50}
.menu-pop button{display:block;width:100%;min-height:44px;text-align:left;background:none;border:0;padding:9px 11px;border-radius:11px;font-size:14.5px}
.menu-pop button:hover{background:var(--surface-2)}
.menu-pop hr{border:0;border-top:1px solid var(--line);margin:5px 2px}

main{padding:15px 0 calc(110px + env(safe-area-inset-bottom))}
nav.tabs{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));z-index:45;max-width:740px;margin:0 auto;background:var(--deep);border:1px solid var(--deep-fill);border-radius:22px;padding:4px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4)}
.tabs-in{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;min-height:48px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--deep-ink-2);font-size:11.5px;font-weight:600;border-radius:17px;transition:background-color .15s ease-out}
.tab svg{width:21px;height:21px}
.tab[aria-selected="true"]{color:var(--deep-ink);background:var(--deep-fill)}
.tab[aria-selected="true"] svg{color:var(--glow)}
@media(min-width:760px){
  nav.tabs{position:sticky;top:calc(54px + env(safe-area-inset-top));bottom:auto;left:auto;right:auto;max-width:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;background:color-mix(in srgb,var(--aurora-top) 72%,transparent);box-shadow:none;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
  .tabs-in{grid-template-columns:repeat(3,max-content);gap:2px;max-width:760px;margin:0 auto}
  .tab{flex-direction:row;gap:7px;padding:10px 15px;border-radius:0;color:var(--ink-3);font-size:13px;border-bottom:2px solid transparent}
  .tab[aria-selected="true"]{color:var(--ink);background:none;border-bottom-color:var(--dato)}
  .tab[aria-selected="true"] svg{color:var(--accent-ink)}
  main{padding-bottom:40px}
}

.card{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:13px 14px}
.eyebrow{font-weight:600;font-size:12.5px;color:var(--ink-2)}
h1,h2,h3{font-family:var(--f-tit);margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:32px;font-weight:700;line-height:1.1}
h2{font-size:23px;font-weight:700;line-height:1.15}
h3{font-size:20px;font-weight:700;line-height:1.2}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
p{margin:0}

.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:14px;min-height:44px;padding:9px 14px;font-weight:600;font-size:14px;transition:background-color .15s ease-out,transform .15s ease-out}
.btn:hover{background:var(--surface-2)}
.btn:active,.tick:active,.seg button:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-family:var(--f-tit);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1.2;box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:12px}
.btn.block{width:100%}
.btn.big{min-height:52px;border-radius:17px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.icobtn{width:44px;height:44px;flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:14px;color:var(--ink-2)}
.icobtn:hover{color:var(--ink);background:var(--surface-2)}
.icobtn svg{width:18px;height:18px}

/* data e tipo di giorno */
.datanav{display:flex;align-items:center;gap:8px}
.datanav .t{flex:1;min-width:0;text-align:center}
.datanav .t h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datanav .t .tiny{color:var(--ink-2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{min-height:48px;border:1px solid var(--edge);background:var(--glass);border-radius:14px;font-weight:600;font-size:14px;line-height:1.2;transition:background-color .15s ease-out,transform .15s ease-out}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--deep);color:var(--deep-ink);border-color:transparent}
.seg button[aria-pressed="true"] small{color:var(--deep-ink-2)}

/* il riquadro che conta: quante kcal mancano */
.hero{background:var(--deep);color:var(--deep-ink);border-radius:var(--r);padding:14px 15px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hero .lbl{font-size:12.5px;font-weight:600;color:var(--glow)}
.hero .big{font-family:var(--f-tit);font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.hero .big small{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:14px;font-weight:500;color:var(--deep-ink-2);margin-left:4px}
.hero .sub{font-size:13px;color:var(--deep-ink-2)}
.hbar{height:10px;border-radius:6px;background:var(--deep-fill);overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mac .k{font-size:11.5px;font-weight:600;color:var(--deep-ink-2)}
.mac .v{font-family:var(--f-tit);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.mac .v small{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11.5px;font-weight:500;color:var(--deep-ink-2)}
.mac .b{height:5px;border-radius:3px;background:var(--deep-fill);overflow:hidden;margin-top:4px}
.mac .b i{display:block;height:100%;border-radius:3px}
.marcia{display:flex;align-items:center;gap:10px;border-top:1px solid var(--deep-fill);padding-top:10px;font-size:13.5px;line-height:1.35}
.marcia span{flex:1}
.marcia b{color:var(--glow)}
.marcia button{flex:0 0 auto;background:var(--accent);color:var(--on-accent);border:0;border-radius:13px;min-height:44px;padding:7px 14px;font-weight:700;font-size:14px}

/* pasti */
.pasto{background:var(--glass);border:1px solid var(--edge);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.p-riga{display:flex;align-items:stretch;min-height:64px}
.cerchio{flex:0 0 50px;display:grid;place-items:center;color:var(--on-up)}
.cerchio svg{width:28px;height:28px}
.cerchio .base{fill:var(--surface);stroke:var(--line-2);stroke-width:2}
.cerchio .segno{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.cerchio[data-st="fatto"] .base{fill:var(--up);stroke:var(--up)}
.cerchio[data-st="saltato"] .base{fill:var(--surface-2);stroke:var(--line-2)}
.cerchio[data-st="saltato"]{color:var(--ink-3)}
.p-apri{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:1px;background:none;border:0;text-align:left;padding:9px 6px 9px 0}
.p-nome{display:flex;align-items:baseline;gap:8px;min-width:0}
.p-nome b{font-family:var(--f-tit);font-size:20px;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-nome .ora{flex:0 0 auto;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-3)}
.p-cosa{font-size:12.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p-kcal{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;padding-right:8px;font-family:var(--f-tit);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.p-kcal small{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:11px;font-weight:500;color:var(--ink-3)}
.tick{flex:0 0 auto;align-self:center;margin-right:10px;width:52px;height:50px;border-radius:15px;border:1px solid var(--line-2);background:var(--surface);display:grid;place-items:center;color:var(--ink-3);transition:background-color .15s ease-out,transform .15s ease-out}
.tick svg{width:22px;height:22px}
.tick[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--on-up)}
.tick:disabled{opacity:.4}
.pasto[data-st="saltato"] .p-nome b{color:var(--ink-2);text-decoration:line-through;text-decoration-thickness:1.5px}
.p-corpo{display:none;flex-direction:column;gap:8px;padding:4px 13px 13px;border-top:1px solid var(--line)}
.pasto[data-aperto="1"] .p-corpo{display:flex}
.cibo{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.cibo .info{flex:1;min-width:0}
.cibo .nome{font-size:14px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.cibo .meta{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-3)}
.gr{position:relative;flex:0 0 96px}
.gr input{width:100%;height:46px;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 24px 0 6px;text-align:center;font-family:var(--f-tit);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.gr input:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.gr u{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--ink-3);text-decoration:none;pointer-events:none}
.p-az{display:flex;gap:6px;flex-wrap:wrap}
.p-az .btn{min-height:48px;flex:1 1 auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:44px;padding:7px 14px;border:1px solid var(--line-2);background:var(--surface);border-radius:100px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent-ink);color:var(--accent-ink)}
.nota{font-size:12.5px;color:var(--ink-2);background:var(--surface-3);border:1px dashed var(--line-2);border-radius:12px;padding:8px 10px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--glass);border:1px solid var(--edge);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.tile .k{font-size:12px;color:var(--ink-3);font-weight:600}
.tile .v{font-family:var(--f-tit);font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:2px}
.tile .v small{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.tile .d{font-size:11.5px;font-weight:600;color:var(--ink-2)}
.d[data-dir="su"],.delta[data-dir="su"]{color:var(--up)}
.d[data-dir="giu"],.delta[data-dir="giu"]{color:var(--down)}
.delta{font-family:"IBM Plex Mono",monospace;font-weight:600;font-variant-numeric:tabular-nums}

.verdetto{border-radius:var(--r);padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.verdetto[data-tipo="azione"]{background:var(--deep);color:var(--deep-ink)}
.verdetto[data-tipo="azione"] .eyebrow{color:var(--glow)}
.verdetto[data-tipo="ok"]{background:var(--glass);border:1px solid var(--edge);box-shadow:var(--shadow)}
.verdetto p{font-size:14px;line-height:1.45}

.fld{position:relative}
.fld input{width:100%;height:56px;border:1px solid var(--line-2);background:var(--surface);border-radius:15px;padding:0 34px 0 10px;text-align:center;font-family:var(--f-tit);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums}
.fld input:focus{border-color:var(--accent-ink);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--ink-3);text-decoration:none;pointer-events:none}

.chart{width:100%}
.chart svg{display:block}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-2)}
.legenda i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}

table.st{width:100%;border-collapse:collapse;font-size:13px}
table.st th{text-align:left;font-size:11.5px;color:var(--ink-3);font-weight:600;padding:8px 7px;border-bottom:1px solid var(--line)}
table.st td{padding:8px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
table.st tr:last-child td{border-bottom:0}
table.st .n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.st th.n{text-align:right}
.tab-scroll{overflow-x:auto}

.vuoto{text-align:center;padding:22px 16px;color:var(--ink-2)}
.vuoto h3{margin-bottom:8px;color:var(--ink)}

dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:0;width:min(460px,calc(100vw - 24px));box-shadow:var(--shadow-alta)}
dialog::backdrop{background:var(--scrim)}

<script>
(function(){
"use strict";

/* ===================== dati del piano (da dati.js, generato da genera.py) ===================== */
const P = window.PIANO;
const CHIAVE = "diario-piatto-v1";
const PASTI = ["Colazione", "Spuntino mattina", "Pranzo", "Spuntino pomeriggio (tascabile)", "Cena"];
const CORTO = {"Spuntino pomeriggio (tascabile)": "Spuntino pomeriggio"};
const GIORNI_SETT = ["Domenica", "Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato"];
const KCAL_PER_KG = 7700;        // kcal in un kg di peso corporeo (stima classica)
const RITMO_MIN = 0.2, RITMO_MAX = 0.5, RITMO_OK = [0.25, 0.35];

/* ===================== piccoli aiuti ===================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (n, d) => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("it-IT", {minimumFractionDigits: d || 0, maximumFractionDigits: d || 0});
const segno = (n, d) => (n > 0 ? "+" : n < 0 ? "−" : "±") + fmt(Math.abs(n), d);
const num = s => { const v = parseFloat(String(s).replace(",", ".")); return isNaN(v) ? null : v; };
const nomeCorto = p => CORTO[p] || p;

function iso(d){ return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daIso(s){ const [a, m, g] = s.split("-").map(Number); return new Date(a, m - 1, g); }
function oggi(){ return iso(new Date()); }
function piuGiorni(s, n){ const d = daIso(s); d.setDate(d.getDate() + n); return iso(d); }
function diffGiorni(a, b){ return Math.round((daIso(b) - daIso(a)) / 864e5); }
function dataLunga(s){ return daIso(s).toLocaleDateString("it-IT", {weekday: "long", day: "numeric", month: "long"}); }
function dataBreve(s){ return daIso(s).toLocaleDateString("it-IT", {day: "2-digit", month: "2-digit"}); }
function lunediDi(s){ const d = daIso(s); const g = (d.getDay() + 6) % 7; d.setDate(d.getDate() - g); return iso(d); }
function minuti(hhmm){ const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function adessoMin(){ const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }

/* ===================== conti sui cibi ===================== */
function valori(nome){ return (stato.miei[nome] && stato.miei[nome].v) || P.alimenti[nome] || null; }
function pezzoG(nome){ return (stato.miei[nome] && stato.miei[nome].pz) || P.pezzi[nome] || null; }
function grammi(nome, q){
  if (typeof q === "string"){ const n = parseFloat(q); return n * (pezzoG(nome) || 0); }
  return Number(q);
}
function macroDi(voci){
  let p = 0, c = 0, f = 0;
  for (const v of voci){
    const val = valori(v.n); if (!val) continue;
    p += val[0] * v.g / 100; c += val[1] * v.g / 100; f += val[2] * v.g / 100;
  }
  return {p, c, f, k: 4 * p + 4 * c + 9 * f};
}
const somma = (a, b) => ({p: a.p + b.p, c: a.c + b.c, f: a.f + b.f, k: a.k + b.k});
const ZERO = {p: 0, c: 0, f: 0, k: 0};
function daLista(l){ return l.map(([n, q]) => ({n, g: Math.round(grammi(n, q))})); }
function etichetta(v){
  const pz = pezzoG(v.n);
  const nome = v.n === P.verdure ? "verdure" : v.n === P.olio ? "olio EVO" : v.n;
  if (pz && v.g % pz === 0 && v.g / pz <= 12) return (v.g / pz) + " " + nome + " (" + v.g + " g)";
  if (v.n === P.olio) return v.g + " g " + nome + " (" + fmt(v.g / 10, 1).replace(",0", "") + " cucch.)";
  const ml = /succo|latte/.test(v.n) ? " ml " : " g ";
  return v.g + ml + nome;
}
function testoVoci(voci){ return voci.length ? voci.map(etichetta).join(" · ") : "niente"; }

/* ===================== stato salvato sul telefono ===================== */
function nuovoStato(){
  const s = {v: 1, giorni: {}, pesi: {}, miei: {}, recenti: [], spesa: {},
    impost: {allenamento: P.giorniAllenamento.slice(), pranzoTardi: P.giorniPranzoTardi.slice(),
      orari: Object.assign({}, P.orari), orariOn: Object.assign({}, P.orariOn), ruolo: undefined}};
  s.pesi["2026-11-18"] = P.profilo.peso_iniziale;
  return s;
}
function carica(){
  try {
    const s = JSON.parse(localStorage.getItem(CHIAVE));
    if (s && s.v === 1){
      const b = nuovoStato();
      s.giorni = s.giorni || {}; s.pesi = s.pesi || {}; s.miei = s.miei || {}; s.recenti = s.recenti || [];
      s.impost = Object.assign(b.impost, s.impost || {});
      s.impost.orari = Object.assign({}, P.orari, s.impost.orari || {});
      s.impost.orariOn = Object.assign({}, P.orariOn, s.impost.orariOn || {});
      if (!Array.isArray(s.impost.allenamento)) s.impost.allenamento = P.giorniAllenamento.slice();
      if (!Array.isArray(s.impost.pranzoTardi)) s.impost.pranzoTardi = P.giorniPranzoTardi.slice();
      if (!s.spesa || typeof s.spesa !== "object") s.spesa = {};
      // chi aveva gia' l'app prima della versione "cucina" e' Andrea

function giorno(d, crea){

const QUOTE = [[1, "Tutto"], [0.75, "¾"], [0.5, "Metà"], [0.25, "¼"]];

/* Le voci di un pasto: quelle modificate a mano se ci sono, altrimenti il piano. */

/* ===================== peso: medie, ritmo, previsioni ===================== */
function pesiOrdinati(){ return Object.keys(stato.pesi).sort().map(d => ({d, kg: stato.pesi[d]})); }
function media7(d){
  const v = pesiOrdinati().filter(x => x.d <= d && diffGiorni(x.d, d) < 7);

  return [...m.entries()].sort((a, b) => a[0] < b[0] ? -1 : 1).map(([l, v]) => ({lun: l, n: v.length, media: v.reduce((s, x) => s + x, 0) / v.length}));

/* Ritmo in kg a settimana: retta dei minimi quadrati sulle pesate degli ultimi 21 giorni. */
function ritmo(){

  if (v.length < 5 || diffGiorni(v[0].d, v[v.length - 1].d) < 10) return null;
  const xs = v.map(x => diffGiorni(v[0].d, x.d)), ys = v.map(x => x.kg);
  const mx = xs.reduce((a, b) => a + b) / xs.length, my = ys.reduce((a, b) => a + b) / ys.length;
  let nu = 0, de = 0;
  for (let i = 0; i < xs.length; i++){ nu += (xs[i] - mx) * (ys[i] - my); de += (xs[i] - mx) ** 2; }

/* Spesa della settimana: somma dei menu' lun-sab con i giorni di allenamento di Andrea. */
function listaSpesa(){
  const lun = lunediCorrente(), tot = {};
  for (let i = 0; i < 6; i++){
    const d = piuGiorni(lun, i), tipo = tipoDi(d) === "ON" ? "ON" : "OFF", nome = GIORNI_SETT[daIso(d).getDay()];
    for (const p of PASTI) for (const v of daLista(((P.menu[tipo] || {})[nome] || {})[p] || [])) tot[v.n] = (tot[v.n] || 0) + v.g;
  }
  const quanti = (n, g) => {
    if (P.aPezzi[n]) return Math.ceil(g / pezzoG(n) - 0.01) + " " + P.aPezzi[n];
    if (/succo|latte/.test(n)) return fmt(Math.ceil(g / 250 - 0.01) * 0.25, 2).replace(/,?0+$/, "") + " litri";
    if (g >= 1000) return fmt(Math.ceil(g / 100 - 0.01) / 10, 1).replace(",0", "") + " kg";
    const passo = g > 100 ? 50 : 10; return Math.ceil(g / passo - 0.01) * passo + " g";
  };
  const per = {};
  for (const n of Object.keys(tot)){
    const [rep, cons] = P.spesa[n] || ["Altro", ""];
    (per[rep] = per[rep] || []).push({n, nome: P.aPezzi[n] ? "" : (n === P.verdure ? "verdure" : NOMI_CUCINA[n] || n), q: quanti(n, tot[n]), cons});
  }
  return {lun, per};
}
function vistaSpesa(){

  let h = '<div class="stack"><h1>Spesa</h1><p class="muted">Per una settimana, <b>solo per Andrea</b>: aggiungete le vostre quantità. Tocca una cosa quando l\'hai presa.</p>';

/* ---------- Oggi ---------- */

  if (eOggi){

/* ---------- Peso ---------- */
function vistaPeso(){
  const ord = pesiOrdinati(), ultimo = ord[ord.length - 1], d = oggi();
  const m7 = media7(d) || (ultimo && ultimo.kg), r = ritmo(), ob = P.profilo.obiettivo;
  let h = '<div class="stack"><h1>Peso</h1>';
  h += '<div class="card pad stack"><div class="eyebrow">Peso di stamattina</div>' +
    '<div class="grid2"><div class="fld"><input id="in-peso" inputmode="decimal" placeholder="' + (ultimo ? fmt(ultimo.kg, 1) : "66,0") + '" value="' + (stato.pesi[d] != null ? fmt(stato.pesi[d], 1) : "") + '" aria-label="Peso in kg"><u>kg</u></div>' +
    '<button class="btn primary big" data-azione="salva-peso">Salva</button></div>' +
    '<p class="small muted">Appena sveglio, dopo il bagno, prima di mangiare. Almeno 4 mattine a settimana: conta la media, non il giorno.</p></div>';

  let eta = "–", etaD = "";
  if (r != null && m7 != null){
    if (r > 0.05){ const sett = (ob - m7) / r; const arr = piuGiorni(d, Math.round(sett * 7)); eta = daIso(arr).toLocaleDateString("it-IT", {month: "short", year: "numeric"}); etaD = "a " + fmt(r, 2).replace("-", "−") + " kg/sett"; }
    else { eta = "mai"; etaD = "a questo ritmo"; }
  }
  const dir = r == null ? "" : r >= RITMO_MIN ? "su" : r < 0 ? "giu" : "";
  h += '<div class="tiles">' +
    tile("Media 7 giorni", m7 != null ? fmt(m7, 1) : "–", "kg", ultimo ? "ultima " + fmt(ultimo.kg, 1) + " il " + dataBreve(ultimo.d) : "") +
    tile("Ritmo", r != null ? segno(r, 2) : "–", "kg/sett", r != null ? "obiettivo +0,25 / +0,35" : "servono 5 pesate in 10+ giorni", dir) +
    tile("Mancano", m7 != null ? fmt(Math.max(0, ob - m7), 1) : "–", "kg", "a " + fmt(ob) + " kg") +
    tile("Arrivo stimato", eta, "", etaD) + '</div>';

  const v = verdetto();
  h += '<div class="verdetto" data-tipo="' + (v.tipo === "azione" ? "azione" : "ok") + '"><div class="eyebrow">' + esc(v.titolo || "Regola del peso") + '</div><p>' + esc(v.testo) + '</p></div>';

  h += '<div class="card pad stack"><div class="spread"><h3>Andamento</h3></div><div class="chart" id="graf-peso"></div>' +
    '<div class="legenda"><span><i style="background:var(--dato)"></i>media 7 giorni</span><span><i style="background:var(--ink-3);height:6px;width:6px;border-radius:50%"></i>pesata</span><span><i style="background:var(--accent-soft);height:8px"></i>ritmo giusto (+0,25 / +0,35 a sett.)</span></div></div>';

  const mt = mantenimento();
  h += '<div class="card pad stack"><h3>Il tuo metabolismo, calcolato</h3>';
  if (!mt) h += '<p class="small muted">Si calcola dalle calorie che segni e da come si muove il peso. Servono almeno 5 pesate in 10 giorni.</p>';
  else if (mt.mancano) h += '<p class="small muted">Servono ancora ' + mt.mancano + ' giorni con i pasti segnati (sugli ultimi 21) per calcolarlo.</p>';
  else {
    const per03 = mt.tdee + 0.3 * KCAL_PER_KG / 7;
    h += '<div class="tiles">' + tile("Mantenimento", fmt(Math.round(mt.tdee / 10) * 10), "kcal", "il peso resta fermo") + tile("Per +0,3 kg/sett", fmt(Math.round(per03 / 10) * 10), "kcal", "al giorno") + '</div>' +
      '<p class="small muted">Calcolato su ' + mt.giorni + ' giorni segnati: hai mangiato in media ' + fmt(mt.media) + ' kcal e il peso si è mosso di ' + segno(mt.ritmo, 2) + ' kg a settimana. Più segni con precisione, più il numero è affidabile. Da mostrare al personal trainer.</p>';
  }
  h += '</div>';

  const st = settimane().slice(-10).reverse();
  if (st.length){
    h += '<div class="card pad stack"><h3>Settimane</h3><div class="tab-scroll"><table class="st"><tr><th>Dal</th><th class="n">Pesate</th><th class="n">Media</th><th class="n">Var.</th><th class="n">kcal medie</th></tr>';
    st.forEach((s, i) => {
      // variazione riportata a una settimana: se in mezzo manca una settimana non sembra il doppio
      const prec = st[i + 1], dv = prec ? (s.media - prec.media) / (diffGiorni(prec.lun, s.lun) / 7) : null;
      const km = kcalMedie(s.lun, 7);
      h += '<tr><td>' + dataBreve(s.lun) + '</td><td class="n">' + s.n + '</td><td class="n">' + fmt(s.media, 1) + '</td><td class="n">' +
        (dv == null ? "–" : '<span class="delta" data-dir="' + (dv >= RITMO_MIN ? "su" : dv < 0 ? "giu" : "") + '">' + segno(dv, 2) + '</span>') + '</td><td class="n">' + (km ? fmt(km) : "–") + '</td></tr>';
    });
    h += '</table></div></div>';
  }
  h += '<div class="card pad stack"><h3>Pesate</h3>' + (ord.length ? ord.slice(-14).reverse().map(x =>
    '<div class="spread" style="min-height:44px"><span>' + esc(dataLunga(x.d)) + '</span><span class="row"><b class="mono">' + fmt(x.kg, 1) + ' kg</b><button class="icobtn" data-togli-peso="' + x.d + '" aria-label="Elimina la pesata del ' + esc(dataBreve(x.d)) + '">' + ICO.x + '</button></span></div>').join("") : '<p class="muted small">Nessuna pesata.</p>') + '</div>';
  h += '</div>';
  return h;
}
function tile(k, v, u, d, dir){
  return '<div class="tile"><div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + (u ? ' <small>' + esc(u) + '</small>' : "") + '</div>' + (d ? '<div class="d"' + (dir ? ' data-dir="' + dir + '"' : "") + '>' + esc(d) + '</div>' : "") + '</div>';
}
function kcalMedie(da, n){
  const v = [];
  for (let i = 0; i < n; i++){ const d = piuGiorni(da, i); if (d > oggi()) break; if (segnato(d)) v.push(mangiato(d).k); }
  return v.length ? v.reduce((a, b) => a + b) / v.length : null;
}

function disegnaGraficoPeso(){
  const box = $("#graf-peso"); if (!box) return;
  const ord = pesiOrdinati();
  if (ord.length < 2){ box.innerHTML = '<p class="small muted">Il grafico compare dalla seconda pesata.</p>'; return; }
  const W = Math.max(280, box.clientWidth), H = 210, L = 38, R = 10, T = 10, B = 26;
  const ini = ord[0], fine = oggi(), span = Math.max(14, diffGiorni(ini.d, fine));
  const x = d => L + diffGiorni(ini.d, d) / span * (W - L - R);
  const corr = g => [ini.kg + RITMO_OK[0] * g / 7, ini.kg + RITMO_OK[1] * g / 7];
  const kgs = ord.map(o => o.kg).concat(corr(span));
  let lo = Math.floor(Math.min(...kgs) - 0.3), hi = Math.ceil(Math.max(...kgs) + 0.3);
  if (hi - lo < 2) hi = lo + 2;
  const y = kg => T + (hi - kg) / (hi - lo) * (H - T - B);
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Andamento del peso">';
  const passo = (hi - lo) > 6 ? 2 : (hi - lo) > 3 ? 1 : 0.5;
  for (let k = lo; k <= hi + 1e-9; k += passo){
    s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(k) + '" y2="' + y(k) + '" stroke="var(--line)" stroke-width="1" opacity=".6"/>' +
      '<text x="' + (L - 6) + '" y="' + (y(k) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">' + fmt(k, passo < 1 ? 1 : 0) + '</text>';
  }
  const c0 = corr(0), c1 = corr(span), fineD = piuGiorni(ini.d, span);
  s += '<polygon points="' + x(ini.d) + ',' + y(c0[0]) + ' ' + x(fineD) + ',' + y(c1[0]) + ' ' + x(fineD) + ',' + y(c1[1]) + ' ' + x(ini.d) + ',' + y(c0[1]) + '" fill="var(--accent-soft)"/>';
  for (const o of ord) s += '<circle cx="' + x(o.d) + '" cy="' + y(o.kg) + '" r="3" fill="var(--ink-3)" opacity=".7"/>';
  const pts = ord.map(o => x(o.d) + "," + y(media7(o.d))).join(" ");
  s += '<polyline points="' + pts + '" fill="none" stroke="var(--dato)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  s += '<text x="' + L + '" y="' + (H - 6) + '" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">' + dataBreve(ini.d) + '</text>' +
    '<text x="' + (W - R) + '" y="' + (H - 6) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">' + dataBreve(fineD) + '</text></svg>';
  box.innerHTML = s;
}

/* ---------- Report ---------- */
function datiPeriodo(n){
  const giorni = [];
  for (let i = n - 1; i >= 0; i--){ const d = piuGiorni(oggi(), -i); giorni.push({d, tipo: tipoDi(d), ob: obiettivoDi(d), m: mangiato(d), seg: segnato(d)}); }
  const seg = giorni.filter(g => g.seg && g.tipo !== "LIBERO" && g.d !== oggi());
  const med = k => seg.length ? seg.reduce((s, g) => s + g.m[k], 0) / seg.length : null;
  const obMed = seg.length ? seg.reduce((s, g) => s + g.ob.kcal, 0) / seg.length : null;
  const nelTarget = seg.filter(g => Math.abs(g.m.k - g.ob.kcal) <= g.ob.kcal * 0.05 || g.m.k > g.ob.kcal).length;
  const conta = {};
  for (const p of PASTI) conta[p] = {fatto: 0, saltato: 0, vuoto: 0};
  for (const g of giorni){
    if (g.d === oggi() || g.tipo === "LIBERO" || !g.seg) continue;
    for (const p of PASTI){ const st = recPasto(g.d, p).st; conta[p][st === "fatto" ? "fatto" : st === "saltato" ? "saltato" : "vuoto"]++; }
  }
  return {giorni, seg, k: med("k"), c: med("c"), p: med("p"), f: med("f"), obMed, nelTarget, conta};
}
function vistaReport(){
  const r = datiPeriodo(periodo);
  let h = '<div class="stack"><h1>Report</h1><div class="seg" role="group" aria-label="Periodo">' +
    [7, 14, 28].map(n => '<button data-periodo="' + n + '" aria-pressed="' + (periodo === n) + '">' + n + ' giorni</button>').join("") + '</div>';
  if (!r.seg.length){
    h += '<div class="card vuoto"><h3>Ancora niente da mostrare</h3><p>Segna i pasti in Oggi: qui vedrai le medie, i pasti che salti più spesso e il riepilogo per il personal trainer.</p></div></div>';
    return h;
  }
  const pc = r.k / r.obMed * 100;
  h += '<div class="tiles">' +
    tile("kcal medie", fmt(r.k), "", fmt(pc) + "% dell'obiettivo", pc >= 95 ? "su" : "giu") +
    tile("Proteine medie", fmt(r.p), "g", "obiettivo 170") +
    tile("Giorni nel target", r.nelTarget + "/" + r.seg.length, "", "almeno il 95% delle kcal") +
    tile("Carbo / grassi", fmt(r.c) + " / " + fmt(r.f), "g", "medie") + '</div>';

  const peggiori = PASTI.map(p => ({p, n: r.conta[p].saltato + r.conta[p].vuoto, tot: r.conta[p].fatto + r.conta[p].saltato + r.conta[p].vuoto})).filter(x => x.n > 0).sort((a, b) => b.n - a.n);
  if (peggiori.length && peggiori[0].n >= 2)
    h += '<div class="verdetto" data-tipo="azione"><div class="eyebrow">Dove perdi calorie</div><p><b>' + esc(nomeCorto(peggiori[0].p)) + '</b>: saltato o non segnato ' + peggiori[0].n + ' volte su ' + peggiori[0].tot + '. ' +
      (P.alternative[peggiori[0].p] ? 'Prova una versione più comoda (' + esc(P.alternative[peggiori[0].p].map(a => a[0]).join(", ")) + ') o mettiti un promemoria dal menu ⋯.' : 'Mettiti un promemoria dal menu ⋯.') + '</p></div>';

  h += '<div class="card pad stack"><h3>Calorie giorno per giorno</h3><div class="chart" id="graf-kcal"></div><div class="legenda"><span><i style="background:var(--dato)"></i>mangiate</span><span><i style="background:var(--ink-2)"></i>obiettivo</span></div></div>';

  h += '<div class="card pad stack"><h3>Pasti</h3><div class="tab-scroll"><table class="st"><tr><th>Pasto</th><th class="n">Fatto</th><th class="n">Saltato</th><th class="n">Non segnato</th></tr>' +
    PASTI.map(p => '<tr><td>' + esc(nomeCorto(p)) + '</td><td class="n">' + r.conta[p].fatto + '</td><td class="n">' + r.conta[p].saltato + '</td><td class="n">' + r.conta[p].vuoto + '</td></tr>').join("") +
    '</table></div><p class="tiny muted">Oggi (ancora in corso) e i giorni liberi non entrano nelle medie.</p></div>';

  h += '<div class="card pad stack"><h3>Giorni</h3><div class="tab-scroll"><table class="st"><tr><th>Giorno</th><th>Tipo</th><th class="n">kcal</th><th class="n">%</th><th class="n">Peso</th></tr>' +
    r.giorni.slice().reverse().map(g => '<tr><td>' + esc(GIORNI_SETT[daIso(g.d).getDay()].slice(0, 3) + " " + dataBreve(g.d)) + '</td><td>' + (g.tipo === "LIBERO" ? "libero" : g.tipo) + '</td><td class="n">' + (g.seg ? fmt(g.m.k) : "–") + '</td><td class="n">' +
      (g.seg ? fmt(g.m.k / g.ob.kcal * 100) : "–") + '</td><td class="n">' + (stato.pesi[g.d] != null ? fmt(stato.pesi[g.d], 1) : "") + '</td></tr>').join("") + '</table></div></div>';

  h += '<button class="btn primary big block" data-azione="per-coach">Manda il riepilogo al personal trainer</button></div>';
  return h;
}
function disegnaGraficoKcal(){
  const box = $("#graf-kcal"); if (!box) return;
  const r = datiPeriodo(periodo), W = Math.max(280, box.clientWidth), H = 180, L = 40, R = 6, T = 8, B = 22;
  const max = Math.max(3500, ...r.giorni.map(g => g.m.k)) * 1.05;
  const bw = (W - L - R) / r.giorni.length, y = k => T + (1 - k / max) * (H - T - B);
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Calorie mangiate per giorno">';
  for (const k of [1000, 2000, 3000]) s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(k) + '" y2="' + y(k) + '" stroke="var(--line)" opacity=".6"/><text x="' + (L - 6) + '" y="' + (y(k) + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">' + fmt(k) + '</text>';
  r.giorni.forEach((g, i) => {
    const x0 = L + i * bw + bw * 0.18, w = bw * 0.64;
    if (g.seg) s += '<rect x="' + x0 + '" y="' + y(g.m.k) + '" width="' + w + '" height="' + (y(0) - y(g.m.k)) + '" rx="' + Math.min(4, w / 2) + '" fill="var(--dato)" opacity="' + (g.tipo === "LIBERO" ? .45 : 1) + '"/>';
    s += '<line x1="' + (L + i * bw + 2) + '" x2="' + (L + (i + 1) * bw - 2) + '" y1="' + y(g.ob.kcal) + '" y2="' + y(g.ob.kcal) + '" stroke="var(--ink-2)" stroke-width="2"/>';
    if (r.giorni.length <= 14 || i % 4 === 0) s += '<text x="' + (L + i * bw + bw / 2) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10.5" fill="var(--ink-3)" font-family="IBM Plex Mono,monospace">' + daIso(g.d).getDate() + '</text>';
  });
  box.innerHTML = s + '</svg>';
}
function testoCoach(){
  // peso: ultima settimana finita contro quella subito prima (la settimana in corso non e' ancora completa)
  const r = datiPeriodo(periodo), st = settimane(), lun0 = lunediDi(oggi());
  const u = st.find(s => s.lun === piuGiorni(lun0, -7)), pr = st.find(s => s.lun === piuGiorni(lun0, -14));
  const righe = ["Riepilogo dieta: ultimi " + periodo + " giorni (" + dataBreve(r.giorni[0].d) + " – " + dataBreve(r.giorni[r.giorni.length - 1].d) + ")"];
  if (r.seg.length){
    righe.push("Kcal medie: " + fmt(r.k) + " su " + fmt(r.obMed) + " (" + fmt(r.k / r.obMed * 100) + "%)");
    righe.push("Medie: carbo " + fmt(r.c) + " g · proteine " + fmt(r.p) + " g · grassi " + fmt(r.f) + " g");
    righe.push("Giorni nel target: " + r.nelTarget + " su " + r.seg.length);
    const salt = PASTI.filter(p => r.conta[p].saltato + r.conta[p].vuoto).map(p => nomeCorto(p) + " " + (r.conta[p].saltato + r.conta[p].vuoto));
    righe.push("Pasti saltati o non segnati: " + (salt.length ? salt.join(", ") : "nessuno"));
  } else righe.push("Nessun giorno segnato nel periodo.");
  if (u) righe.push("Peso: media della settimana scorsa " + fmt(u.media, 1) + " kg" + (pr ? " (" + segno(u.media - pr.media, 2) + " kg sulla settimana prima)" : ""));
  const rt = ritmo(); if (rt != null) righe.push("Ritmo ultime 3 settimane: " + segno(rt, 2) + " kg/settimana");
  const mt = mantenimento(); if (mt && mt.tdee) righe.push("Mantenimento stimato: ~" + fmt(Math.round(mt.tdee / 10) * 10) + " kcal");
  return righe.join("\n");
}

/* Nel backup va anche il riepilogo gia' calcolato di ogni giorno: lo legge pesate.py sul computer. */
function calcolatoPerAnalisi(){
  const giorni = {};
  for (const d of Object.keys(stato.giorni).sort()){
    if (!segnato(d)) continue;
    const m = mangiato(d), ob = obiettivoDi(d), pasti = {};
    for (const p of PASTI) pasti[nomeCorto(p)] = recPasto(d, p).st || "non segnato";
    giorni[d] = {tipo: tipoDi(d), kcal: Math.round(m.k), carbo: Math.round(m.c), prote: Math.round(m.p), grassi: Math.round(m.f), obiettivo: ob.kcal, pasti};
  }
  return {creato: new Date().toISOString(), giorni, pesi: stato.pesi};
}

function categoria(nome){
  const v = valori(nome), k = 4 * v[0] + 4 * v[1] + 9 * v[2];
  if (stato.miei[nome]) return "miei";
  if (k <= 0) return "altro";
  if (v[1] * 4 / k >= 0.55) return "carbo";
  if (v[0] * 4 / k >= 0.4) return "prote";
  if (v[2] * 9 / k >= 0.55) return "grassi";
  return "misti";
}

function aggiungiVoce(dove, v){
  const d = dataSel, g = giorno(d, true);

/* Promemoria in formato iCalendar (RFC 5545): eventi da 15 minuti ripetuti da lunedi' a sabato. */
function creaIcs(pasti){
  const inizio = piuGiorni(oggi(), 1);
  const ora = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+/, "");
  const testo = s => String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\n/g, "\\n");
  // righe oltre 75 byte spezzate con a capo + spazio, senza tagliare a meta' un carattere
  const piega = riga => {
    const enc = new TextEncoder(); let out = "", cur = "", n = 0;
    for (const ch of riga){ const b = enc.encode(ch).length; if (n + b > 75){ out += cur + "\r\n "; cur = ""; n = 1; } cur += ch; n += b; }
    return out + cur;
  };
  const righe = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Diario del Piatto//IT", "CALSCALE:GREGORIAN"];
  // giorni di allenamento e di riposo hanno orari (e pasti) diversi: un evento per gruppo di giorni
  const SIGLE = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"];
  const on = stato.impost.allenamento || [], tardi = stato.impost.pranzoTardi || [];
  for (const p of pasti){
    // per ogni giorno lun-sab: c'e' il pasto? a che ora? poi un evento per ogni orario diverso
    const perOra = {};
    for (const w of [1, 2, 3, 4, 5, 6]){
      const tipo = on.includes(w) ? "ON" : "OFF", voci = ((P.menu[tipo] || {})[GIORNI_SETT[w]] || {})[p] || [];
      if (!voci.length) continue;
      const orario = tipo === "ON" && tardi.includes(w) && stato.impost.orariOn[p] ? stato.impost.orariOn[p] : stato.impost.orari[p];
      (perOra[orario] = perOra[orario] || []).push(w);
    }
    const gruppi = Object.entries(perOra);
    const fisso = P.pastiFissi.find(x => x[0] === p);
    for (const [orario, giorni] of gruppi){
      if (!giorni.length) continue;
      // il primo evento deve cadere in uno dei giorni della regola
      let primo = inizio; while (!giorni.includes(daIso(primo).getDay())) primo = piuGiorni(primo, 1);
      const hhmm = orario.replace(":", "");
      righe.push("BEGIN:VEVENT", "UID:piatto-" + hhmm + "-" + giorni.join("") + "-" + p.replace(/\W/g, "") + "@diario-del-piatto", "DTSTAMP:" + ora,
        "DTSTART:" + primo.replace(/-/g, "") + "T" + hhmm + "00", "DURATION:PT15M",
        "RRULE:FREQ=WEEKLY;BYDAY=" + giorni.map(w => SIGLE[w]).join(","), "SUMMARY:" + testo(nomeCorto(p)),
        "DESCRIPTION:" + testo(fisso ? testoVoci(daLista(fisso[1])) : "Segna il pasto nel Diario del Piatto"),
        "BEGIN:VALARM", "ACTION:DISPLAY", "DESCRIPTION:" + testo(nomeCorto(p)), "TRIGGER:PT0M", "END:VALARM", "END:VEVENT");
    }
  }
  righe.push("END:VCALENDAR");
  return righe.map(piega).join("\r\n") + "\r\n";
}
async function scarica(nome, testo, tipo){
  const file = new File([testo], nome, {type: tipo});
  if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/.test(navigator.userAgent)){
    try { await navigator.share({files: [file], title: nome}); return; } catch (e) { if (e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = nome;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function applicaGrammi(inp){
  if (!inp || !inp.dataset.gr || inp.dataset.applicato === inp.value) return false;
  inp.dataset.applicato = inp.value;
  const dove = inp.dataset.gr, i = Number(inp.dataset.i), g = Math.round(num(inp.value) || 0), d = dataSel;
  if (dove === "extra"){ const gg = giorno(d, true); if (!gg.extra[i]) return false; if (g > 0) gg.extra[i].g = g; else gg.extra.splice(i, 1); }
  else {
    const r = congela(d, dove); if (!r.voci[i]) return false;
    r.voci = r.voci.map(v => Object.assign({}, v));
    if (g > 0) r.voci[i].g = g; else r.voci.splice(i, 1);
  }
  salva(); return true;
}

    if (r.st === "saltato") r.st = undefined; else { congela(d, p).st = "saltato"; }
    salva(); render(); return; }
  if (b.dataset.ripristina){ const r = recPasto(d, b.dataset.ripristina, true); for (const k of ["voci", "pieno", "quota", "recuperato", "scambio"]) delete r[k]; salva(); render(); return; }

  if (b.dataset.quota){

  }

<script>
/* Service worker: l'app funziona anche senza campo. Quando c'e' una versione nuova compare una striscia. */
if ("serviceWorker" in navigator && location.protocol !== "file:"){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const mostra = w => {
        if (document.querySelector(".aggiorna")) return;
        const el = document.createElement("div");
        el.className = "aggiorna";
        el.innerHTML = '<span>Nuova versione disponibile</span><button>Aggiorna</button>';
        el.querySelector("button").onclick = () => w.postMessage({tipo: "ATTIVA_SUBITO"});
        document.body.appendChild(el);
      };
      if (reg.waiting && navigator.serviceWorker.controller) mostra(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        w && w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) mostra(w); });
      });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
    let ricaricata = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!ricaricata){ ricaricata = true; location.reload(); } });
  });
}
</script>
